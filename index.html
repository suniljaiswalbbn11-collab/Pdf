

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG से PDF कनवर्टर - मुफ़्त ऑनलाइन टूल</title>
    <!-- jsPDF लाइब्रेरी जो इमेज को PDF में बदलेगी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 90vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .upload-btn { background: #ff4757; color: white; padding: 12px 20px; border-radius: 6px; cursor: pointer; display: inline-block; font-weight: bold; font-size: 16px; width: 100%; box-sizing: border-box; }
        .upload-btn:hover { background: #ff6b81; }
        #convertBtn { background: #2ed573; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; display: none; }
        #convertBtn:hover { background: #26af5f; }
        #fileList { margin: 15px 0; font-size: 14px; color: #333; text-align: left; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>JPG से PDF कनवर्टर</h2>
    <p>अपनी इमेज चुनें और तुरंत PDF डाउनलोड करें</p>
    
    <label for="fileInput" class="upload-btn">इमेज चुनें (Select Images)</label>
    <input type="file" id="fileInput" multiple accept="image/*">
    
    <div id="fileList"></div>
    
    <button id="convertBtn" onclick="convertToPdf()">PDF डाउनलोड करें</button>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const convertBtn = document.getElementById('convertBtn');
    
    let selectedFiles = [];

    fileInput.addEventListener('change', (e) => {
        selectedFiles = Array.from(e.target.files);
        if (selectedFiles.length > 0) {
            fileList.innerHTML = `<b>चुनी गई फाइलें (${selectedFiles.length}):</b><br>` + selectedFiles.map(f => f.name).join('<br>');
            convertBtn.style.display = 'block';
        } else {
            fileList.innerHTML = '';
            convertBtn.style.display = 'none';
        }
    });

    async function convertToPdf() {
        if (selectedFiles.length === 0) return;

        convertBtn.innerText = "प्रोसेसिंग हो रही है...";
        convertBtn.disabled = true;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();

        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles.get ? selectedFiles[i] : selectedFiles[i];
            const imgData = await readFileAsDataURL(file);
            
            if (i > 0) {
                pdf.addPage();
            }
            
            // इमेज को पीडीएफ पेज पर फिट करना
            pdf.addImage(imgData, 'JPEG', 10, 10, 190, 0);
        }

        pdf.save("converted-images.pdf");
        
        convertBtn.innerText = "PDF डाउनलोड करें";
        convertBtn.disabled = false;
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
