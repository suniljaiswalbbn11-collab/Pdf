<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF - Combine PDF Files Online Free</title>
    <!-- PDF-Lib Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #333; }
        header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #eaeaea; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 20px; font-weight: bold; color: #e53935; text-decoration: none; }
        .back-home { background: #f1f3f5; color: #333; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: 600; }
        .back-home:hover { background: #e2e6ea; }

        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        h1 { color: #222; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }

        .upload-box { border: 2px dashed #cbd5e1; padding: 30px; border-radius: 10px; background: #f8fafc; margin-bottom: 20px; cursor: pointer; transition: 0.2s; }
        .upload-box:hover { border-color: #e53935; background: #fff5f5; }
        input[type="file"] { display: none; }
        .file-label { font-size: 16px; font-weight: 600; color: #e53935; cursor: pointer; }
        
        .action-btn { background: #e53935; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: #c62828; }
        
        .status { margin-top: 20px; font-weight: bold; color: #2e7d32; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">Sunil PDF Tools</a>
    <a href="index.html" class="back-home">⬅ होम (Home)</a>
</header>

<div class="container">
    <h1>Merge PDF Files</h1>
    <p>कई सारी पीडीएफ फाइलों को एक साथ जोड़कर सिंगल पीडीएफ बनाएं</p>

    <div class="upload-box" onclick="document.getElementById('mergeInput').click()">
        <span style="font-size: 40px; display: block; margin-bottom: 10px;"></span>
        <span class="file-label">यहाँ क्लिक करके पीडीएफ फाइलें चुनें (कम से कम 2)</span>
        <input type="file" id="mergeInput" multiple accept="application/pdf" onchange="showFileName()">
    </div>

    <div id="fileCount" style="margin-bottom: 15px; font-size: 13px; color: #555; font-weight: 600;"></div>

    <button class="action-btn" onclick="mergePdfs()">PDF मर्ज करें और डाउनलोड करें</button>
    <div class="status" id="statusMessage"></div>
</div>

<script>
    function showFileName() {
        const input = document.getElementById('mergeInput');
        const countDisplay = document.getElementById('fileCount');
        if (input.files.length > 0) {
            countDisplay.innerText = `${input.files.length} फाइलें चुनी गई हैं।`;
        }
    }

    async function mergePdfs() {
        const fileInput = document.getElementById('mergeInput');
        const status = document.getElementById('statusMessage');
        
        if (fileInput.files.length < 2) {
            alert('कृपया कम से कम 2 पीडीएफ फाइलें चुनें!');
            return;
        }

        status.innerText = "फाइलें जोड़ी जा रही हैं, कृपया प्रतीक्षा करें...";

        try {
            const mergedPdf = await PDFLib.PDFDocument.create();
            for (let file of fileInput.files) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }

            const mergedPdfBytes = await mergedPdf.save();
            const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "merged-sunilpdf.pdf";
            link.click();

            status.innerText = "सफलतापूर्वक! पीडीएफ मर्ज होकर डाउनलोड हो गई है।";
        } catch (error) {
            console.error(error);
            status.innerText = "एरर: फाइल प्रोसेस करने में दिक्कत आई।";
        }
    }
</script>

</body>
</html>
